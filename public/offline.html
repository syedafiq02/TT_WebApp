<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#ffffff" />
        <meta name="robots" content="noindex" />
        <title>Offline · Terpaling Trader</title>
        <link rel="icon" href="/icons/icon-192.png" />
        <!--
            Served by the service worker (src/pwa/sw.js) when a page cannot be
            loaded from the network. Self-contained: no app bundle, no fonts,
            no user data.
        -->
        <style>
            * { box-sizing: border-box; }
            html { color-scheme: light; }
            body {
                margin: 0;
                min-height: 100vh;
                min-height: 100dvh;
                display: grid;
                place-items: center;
                padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
                background: #f8fafc;
                color: #0f172a;
                font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
                -webkit-font-smoothing: antialiased;
            }
            .card {
                width: 100%;
                max-width: 26rem;
                padding: 32px;
                border: 1px solid #e2e8f0;
                border-radius: 12px;
                background: #fff;
                box-shadow: 0 1px 2px 0 rgb(15 23 42 / 0.04), 0 1px 3px 0 rgb(15 23 42 / 0.03);
                text-align: center;
            }
            .logo {
                display: inline-flex;
                align-items: center;
                gap: 10px;
                margin-bottom: 28px;
                text-align: start;
            }
            .mark {
                display: grid;
                place-items: center;
                width: 32px;
                height: 32px;
                border-radius: 8px;
                background: #2563eb;
                color: #fff;
                font-size: 11px;
                font-weight: 700;
                box-shadow: inset 0 -1px 0 rgb(0 0 0 / 0.12);
            }
            .name { font-size: 13.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
            .icon {
                display: grid;
                place-items: center;
                width: 48px;
                height: 48px;
                margin: 0 auto 16px;
                border-radius: 999px;
                background: #eff6ff;
                color: #2563eb;
            }
            h1 { margin: 0 0 8px; font-size: 18px; font-weight: 600; }
            p { margin: 0; font-size: 14px; line-height: 1.6; color: #475569; }
            button {
                margin-top: 24px;
                padding: 10px 16px;
                border: 0;
                border-radius: 8px;
                background: #2563eb;
                color: #fff;
                font: inherit;
                font-size: 14px;
                font-weight: 500;
                cursor: pointer;
            }
            button:hover { background: #1d4ed8; }
            .hint { margin-top: 12px; font-size: 12px; color: #94a3b8; }
        </style>
    </head>
    <body>
        <main class="card">
            <div class="logo" aria-hidden="true">
                <span class="mark">TT</span>
                <span class="name">Terpaling Trader</span>
            </div>
            <div class="icon" aria-hidden="true">
                <svg width="24" height="24" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18M8.288 15.038a5.25 5.25 0 017.424 0M5.106 11.856c.63-.63 1.32-1.17 2.05-1.616m3.534-1.34a9.004 9.004 0 015.204 2.956M1.924 8.674a13.5 13.5 0 014.268-2.85m3.636-.778a13.47 13.47 0 0112.248 3.628M12.53 18.22l-.53.53-.53-.53a.75.75 0 011.06 0z" />
                </svg>
            </div>
            <h1>You're offline</h1>
            <p>Terpaling Trader needs an internet connection for live platform features such as your account, products, subscriptions and payments. Check your connection and try again.</p>
            <button type="button" onclick="location.reload()">Try again</button>
            <p class="hint">This page will reload automatically when you're back online.</p>
        </main>
        <script>
            window.addEventListener('online', () => location.reload());
        </script>
    </body>
</html>
