        <title>Offline · Terpaling Trader</title>

        <!--
            Served by the service worker (src/pwa/sw.js) when a page cannot be
            loaded from the network. Self-contained: no app bundle, no fonts,
            no user data.
        -->
        <style>
            * { box-sizing: border-box; }
            html { color-scheme: light; }
            body {
                margin: 0;
                min-height: 100vh;
                min-height: 100dvh;
                display: grid;
                place-items: center;
                padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
                background: #f8fafc;
                color: #0f172a;
                font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
                -webkit-font-smoothing: antialiased;
            }
            .card {
                width: 100%;
                max-width: 26rem;
                padding: 32px;
                border: 1px solid #e2e8f0;
                border-radius: 12px;
                background: #fff;
                box-shadow: 0 1px 2px 0 rgb(15 23 42 / 0.04), 0 1px 3px 0 rgb(15 23 42 / 0.03);
                text-align: center;
            }
            .logo {
                display: inline-flex;
                align-items: center;
                gap: 10px;
                margin-bottom: 28px;
                text-align: start;
            }
            .mark {
                display: grid;
                place-items: center;
                width: 32px;
                height: 32px;
                border-radius: 8px;
                background: #2563eb;
                box-shadow: inset 0 -1px 0 rgb(0 0 0 / 0.12);
            }
            .mark img { display: block; width: 24px; height: auto; }
            .name { font-size: 13.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
            .icon {
                display: grid;
                place-items: center;
                width: 48px;
                height: 48px;
                margin: 0 auto 16px;
                border-radius: 999px;
                background: #eff6ff;
                color: #2563eb;
            }
            h1 { margin: 0 0 8px; font-size: 18px; font-weight: 600; }
            p { margin: 0; font-size: 14px; line-height: 1.6; color: #475569; }
            button {
                margin-top: 24px;
                padding: 10px 16px;
                border: 0;
                border-radius: 8px;
                background: #2563eb;
                color: #fff;
                font: inherit;
                font-size: 14px;
                font-weight: 500;
                cursor: pointer;
            }
            button:hover { background: #1d4ed8; }
            .hint { margin-top: 12px; font-size: 12px; color: #94a3b8; }
        </style>
    </head>
